[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*,server/*,docs/*,build/*,*.ps1,*.cmd,*.md"
export_path="build/LastCore.exe"
script_export_mode=2

[preset.0.options]
custom_template/release="D:/codex/tools/godot/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
application/product_name="Last Core"
application/file_description="Last Core - Endless Tower Defense"
application/product_version="0.1.0"
application/file_version="0.1.0"
codesign/enable=false

[preset.1]
name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,assets/fonts/OFL.txt"
exclude_filter="tests/*,server/*,docs/*,build/*,*.py,*.ps1,*.cmd,*.md"
export_path="build/LastCore-Android.apk"
script_export_mode=2

[preset.1.options]
custom_template/debug="D:/codex/tools/godot/android_debug.apk"
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=3
version/name="0.3.0-offline"
package/unique_name="com.xizhi3002.lastcore"
package/name="最后核心"
package/signed=true
package/app_category=2
screen/immersive_mode=true
