[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*,server/*,docs/*,build/*,*.ps1,*.cmd,*.md"
export_path="build/LastCore.exe"
script_export_mode=2

[preset.0.options]
custom_template/release="D:/codex/tools/godot/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
application/product_name="Last Core"
application/file_description="Last Core - Endless Tower Defense"
application/product_version="0.1.0"
application/file_version="0.1.0"
codesign/enable=false
